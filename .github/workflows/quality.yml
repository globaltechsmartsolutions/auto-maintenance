name: WIAControl Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wia_control_ci
      NEXT_PUBLIC_DEMO_MODE: "true"
      DEMO_MODE: "true"
      NEXT_PUBLIC_CRM_ENABLED: "false"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run preprod:verify
